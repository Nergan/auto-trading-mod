name: Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# Пуш в main (и тег v<mod_version> / ручной запуск) пересобирает Fabric 26.3
# и обновляет одну страницу GitHub Release. Modrinth и McnCDN не публикуются.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read versions from gradle.properties
        id: versions
        run: |
          set -euo pipefail
          prop() { grep -E "^$1=" gradle.properties | cut -d= -f2- | tr -d '\r'; }
          echo "mod_version=$(prop mod_version)" >> "$GITHUB_OUTPUT"
          echo "fabric_api_version=$(prop fabric_api_version)" >> "$GITHUB_OUTPUT"
          echo "fabric_kotlin_version=$(prop fabric_kotlin_version)" >> "$GITHUB_OUTPUT"
          echo "cloth_config_modrinth_version=$(prop cloth_config_modrinth_version)" >> "$GITHUB_OUTPUT"
          echo "modmenu_version=$(prop modmenu_version)" >> "$GITHUB_OUTPUT"
          echo "mod_version=$(prop mod_version)" >> "$GITHUB_ENV"

      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="v${{ steps.versions.outputs.mod_version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag ${actual} must be ${expected} (mod_version in gradle.properties)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          # services.gradle.org publishes 9.7.0, not the short form 9.7.
          gradle-version: "9.7.0"

      - name: Build and test
        run: gradle build --stacktrace

      - name: Collect release jars
        run: |
          set -euo pipefail
          mkdir -p release-assets companions
          shopt -s nullglob
          jars=(build/libs/autotrading-fabric-26.3-*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "No autotrading jar in build/libs"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-javadoc.jar|*-dev.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/autotrading-fabric-26.3-${{ steps.versions.outputs.mod_version }}.jar"
          chmod +x .github/scripts/fetch-companion-jars.sh
          .github/scripts/fetch-companion-jars.sh \
            companions \
            "${{ steps.versions.outputs.fabric_api_version }}" \
            "${{ steps.versions.outputs.fabric_kotlin_version }}" \
            "${{ steps.versions.outputs.cloth_config_modrinth_version }}" \
            "${{ steps.versions.outputs.modmenu_version }}"
          ls -lh release-assets companions

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_TAG: v${{ steps.versions.outputs.mod_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          rm -rf release-split
          ver="${{ steps.versions.outputs.mod_version }}"
          stage() {
            local tag="$1"
            local title="$2"
            local body="$3"
            shift 3
            local dir="release-split/${tag}"
            mkdir -p "${dir}"
            printf '%s\n' "${title}" > "${dir}/title.txt"
            printf '%s\n' "${body}" > "${dir}/body.md"
            cp -v "$@" "${dir}/"
          }
          stage minecraft-26.3-fabric \
            "auto trading for minecraft 26.3 fabric" \
            "Minecraft **26.3** / Fabric. \`autotrading-fabric-26.3-${ver}.jar\` is required. Fabric API, Fabric Language Kotlin, and Cloth Config are required. Mod Menu is optional and opens the config screen. \`all-jars.zip\` contains every jar on this page." \
            release-assets/autotrading-fabric-26.3-*.jar \
            companions/fabric-api-*.jar \
            companions/fabric-language-kotlin-*.jar \
            companions/cloth-config-*.jar \
            companions/modmenu-*.jar
          python3 .github/scripts/publish-split-releases.py release-split
