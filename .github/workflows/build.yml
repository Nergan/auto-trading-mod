name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          # services.gradle.org publishes 9.7.0, not the short form 9.7.
          gradle-version: "9.7.0"

      - name: Build mod jar
        run: gradle build --stacktrace

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotrading-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
